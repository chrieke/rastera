[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rastera"
version = "0.1.0"
description = "Async raster reader with bounds/window/merge read functionality, based on async-geotiff"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "affine>=2.4.0",
    "async-geotiff>=0.5.1",
    "numpy>=2.2.6",
    "obstore>=0.9.0",
    "pyproj>=3.7.1",
]

[project.optional-dependencies]
index = ["geopandas>=1.0.0", "pyarrow>=18.0.0", "shapely>=2.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: tests that hit real remote services (deselected by default)",
]

[dependency-groups]
dev = [
    "ruff==0.16.0",
    "pyright>=1.1.408,<2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "boto3>=1.42.93",
    # So the optional index code path is covered by the default test run.
    "geopandas>=1.0.0",
    "pyarrow>=18.0.0",
    "shapely>=2.0.0",
    "pre-commit>=4.6.1",
]

[tool.uv]
# numpy 2.5 ships stubs that make np.unique/np.array_equal partially unknown,
# which trips reportUnknownMemberType in ~70 places. Runtime is unaffected, so
# this caps our lock only — `numpy>=2.2.6` above is what consumers resolve
# against. Drop once numpy's stubs type those again.
constraint-dependencies = ["numpy<2.5"]

[tool.ruff]
src = ["rastera"]
line-length = 88
fix = true

[tool.ruff.lint]
# Selected outright rather than extending ruff's default set, because that set
# is not stable across releases: 0.16 grew it to ~418 rules and dropped E402 in
# the same move, so `extend-select` would have silently swapped this project's
# lint policy for a different one — losing a check tests/test_index.py relies on
# and adding hundreds that mostly flag deliberate choices here. E4/E7/E9/F is
# the historical default, spelled out so a ruff upgrade can only change
# formatting and fixes, never which rules apply.
select = [
    "E4",   # pycodestyle: imports
    "E7",   # pycodestyle: statements
    "E9",   # pycodestyle: runtime errors
    "F",    # pyflakes
    "E501", # line length
    "I",    # isort
    "UP",   # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = ["E501"]
"tests/**/*.py" = ["E501"]
"examples/**/*.py" = ["E501"]
"notebooks/**/*.ipynb" = ["E501", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["rastera"]

[tool.pyright]
include = ["rastera", "tests"]
# Lowest supported interpreter, so 3.12+ syntax and stdlib use get caught.
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
# Hand-written stubs for dependencies that ship no annotations.
stubPath = "typings"
strictListInference = true
strictSetInference = true
strictDictionaryInference = true
analyzeUnannotatedFunctions = true
reportUnknownMemberType = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedClassDecorator = "error"
reportMissingParameterType = "error"
reportMatchNotExhaustive = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportMissingTypeArgument = "error"
reportDeprecated = "error"

[tool.setuptools.packages.find]
include = ["rastera*"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so downstream type checkers use rastera's
# inline annotations instead of reporting missing stubs.
rastera = ["py.typed"]
