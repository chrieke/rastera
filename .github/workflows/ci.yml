name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail instead of silently resolving a different set of versions than uv.lock.
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No floating v9 tag is published, so pin the exact release.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      # `fix = true` in pyproject.toml, so CI has to opt out of rewriting files.
      - run: uv run ruff check --no-fix .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      # `live` tests are deselected by addopts; they need real remote storage.
      - run: uv run pytest -q
